<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOX MODEL</title>
    
</head>
<STYLE>
    *{
        margin: 0;
        padding: 0;

    }
    .box{
        height: 299px;
        width: 345px;
        background: red;
        /*margin: 14px 2px 11px 4px;*/
        margin: 7px 11px;
        padding: 13px;
       border: 4px solid black;
       border-width: 3px;
       border-style: dotted;
       border-color: aqua;
       border-radius: 29px;
    }
</STYLE>
<body>
    <div class="box">Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, at id eveniet soluta iste voluptatibus provident dicta vel nostrum saepe iusto delectus neque temporibus qui architecto veritatis et distinctio. Quo ullam adipisci nam architecto!</div>
</body>
</html>
